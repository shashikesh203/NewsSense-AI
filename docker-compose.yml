
services:
  backend:
    build: .
    container_name: chat-backend
    ports:
      - "4000:4000"
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    restart: always

  postgres:
    image: postgres:15
    container_name: chat-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7
    container_name: chat-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always

  pgadmin:
    image: dpage/pgadmin4
    container_name: chat-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD} 
    ports:
      - "5050:80"
    depends_on:
      - postgres
    restart: always

  redisinsight:
    image: redis/redisinsight:latest
    container_name: chat-redisinsight
    ports:
      - "5540:5540"
    depends_on:
      - redis
    restart: always

volumes:
  postgres_data:
  redis_data:
